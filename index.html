<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boréal Endurance</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

/* MENU */

header {
    background: #0b3d2e;
    padding: 22px 50px;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: white;
    font-size: 2rem;
    font-weight: bold;
}

.menu {
    display: flex;
    gap: 45px;
}

.menu a {
    color: white;
    text-decoration: none;
    font-size: 1.15rem;
    font-weight: 600;
    padding-bottom: 10px;
}

.menu a.active {
    border-bottom: 4px solid #a8d65a;
}

/* BANNIÈRE */

.hero {
    height: 700px;

    background:
    linear-gradient(
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.35)
    ),
    url("banniere.jpg");

    background-size: cover;
    background-position: center;

    display: flex;
    align-items: center;
}

.hero-content {
    max-width: 700px;
    margin-left: 70px;
}

.hero h1 {
    color: white;
    font-size: 5rem;
    margin-bottom: 25px;
}

.trait {
    width: 80px;
    height: 5px;
    background: #a8d65a;
    margin-bottom: 30px;
}

.hero h2 {
    color: white;
    font-size: 3rem;
    line-height: 1.2;
    margin-bottom: 25px;
}

.hero p {
    color: #a8d65a;
    font-size: 1.6rem;
    font-weight: bold;
    margin-bottom: 40px;
}

.bouton {
    display: inline-block;
    background: #a8d65a;
    color: #0b3d2e;
    text-decoration: none;
    padding: 18px 40px;
    border-radius: 8px;
    font-size: 1.3rem;
    font-weight: bold;
}

.bouton:hover {
    opacity: 0.9;
}

</style>

</head>

<body>

<header>

<nav>

<div class="logo">
🌲 Boréal Endurance
</div>

<div class="menu">
<a class="active" href="index.html">Accueil</a>

<a href="mission.html">Mission</a>
<a href="services.html">Services</a>
<a href="contact.html">Contact</a>
</div>

</nav>

</header>

<section class="hero">

<div class="hero-content">

<h1>Boréal Endurance</h1>

<div class="trait"></div>

<h2>
L'endurance se construit<br>
dans la constance.
</h2>

<p>
Coaching personnalisé en course à pied et triathlon.
</p>

<a href="contact.html" class="bouton">
Contactez-nous
</a>
